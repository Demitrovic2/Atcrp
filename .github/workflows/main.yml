name: Build ATC RP APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract ATC RP project
        run: unzip -o ATC-RP-Android-build-ready.zip

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22.16.0'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"

      - name: Install dependencies
        working-directory: atc-rp
        run: npm install --no-audit --no-fund

      - name: Restore trusted Gradle wrapper
        run: |
          cp atc-rp/node_modules/@react-native/gradle-plugin/gradle/wrapper/gradle-wrapper.jar \
             atc-rp/android/gradle/wrapper/gradle-wrapper.jar

      - name: Build ATC RP APK
        working-directory: atc-rp/android
        run: |
          chmod +x gradlew
          ./gradlew clean app:assembleRelease \
            -PreactNativeArchitectures=arm64-v8a \
            --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p output
          cp atc-rp/android/app/build/outputs/apk/release/app-release.apk \
             output/ATC-RP.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ATC-RP-APK
          path: output/ATC-RP.apk
          if-no-files-found: error
          retention-days: 30
