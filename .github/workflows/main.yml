name: Build ATC RP Native APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Download linked ATC RP source
        run: |
          mkdir -p atc-rp
          curl -fL --retry 3 http://172.239.18.104:8080/ATC-RP-Native-v1-source.zip -o source.zip
          unzip -q source.zip -d atc-rp
      - uses: actions/setup-node@v5
        with:
          node-version: '22.16.0'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Install Android tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1"
      - name: Install dependencies
        working-directory: atc-rp
        run: npm install --no-audit --no-fund
      - name: Restore Gradle wrapper
        run: cp atc-rp/node_modules/@react-native/gradle-plugin/gradle/wrapper/gradle-wrapper.jar atc-rp/android/gradle/wrapper/gradle-wrapper.jar
      - name: Build APK
        working-directory: atc-rp/android
        run: |
          chmod +x gradlew
          ./gradlew clean app:assembleRelease -PreactNativeArchitectures=arm64-v8a --stacktrace
      - name: Prepare APK
        run: |
          mkdir -p output
          cp atc-rp/android/app/build/outputs/apk/release/app-release.apk output/ATC-RP-Native-v1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ATC-RP-Native-v1
          path: output/ATC-RP-Native-v1.apk
          retention-days: 30
