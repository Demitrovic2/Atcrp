name: Probe ATC RP iOS Source

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify iOS source exists
        run: |
          set -euxo pipefail
          unzip -l ATC-RP-Android-build-ready.zip | grep 'ios/ATCRP.xcodeproj/project.pbxproj'
          echo 'IOS_SOURCE_PRESENT=yes'
